set_schedule:
  name: Nastav tyzdenny rozvrh zony
  description: >
    Ulozi cely tyzdenny rozvrh (48 x 30-minutovych blokov na kazdy den) pre danu zonu.
    True = ocakavany pobyt doma (komfort), False = prec (len udrziavanie na Min).
  fields:
    zone_id:
      name: ID zony
      description: Interne ID zony (napr. 287f437c) - najdes v atributoch sensor..._stav.
      required: true
      example: "287f437c"
      selector:
        text:
    schedule:
      name: Rozvrh
      description: >
        Objekt so 7 klucmi (mon, tue, wed, thu, fri, sat, sun), kazdy je zoznam
        presne 48 hodnot true/false.
      required: true
      example: '{"mon": [false, false, ...], "tue": [...], ...}'
      selector:
        object:
