name: Release

# Pri publikovani releasu:
#  1. over, ze verzia v manifest.json sedi s tagom,
#  2. zabali custom_components/smart_heating do smart_heating.zip
#     (manifest.json v koreni archivu) a prilozi ho k releasu.
# HACS (zip_release v hacs.json) stahuje tento ZIP, takze GitHub pocita stiahnutia.
# Rucne spustenie (workflow_dispatch) prilozi ZIP k uz existujucemu releasu.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existujuci release tag presne ako na GitHube (napr. 0.24.1)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Najdi skutocny tag: zadany, bez "v" alebo s "v". Pri rucnom spusteni
      # sa lahko zada v0.24.1, hoci tag je 0.24.1 - checkout by potom zlyhal.
      - name: Resolve release tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          T="$(echo "$INPUT_TAG" | xargs)"
          for c in "$T" "${T#v}" "v${T#v}"; do
            if gh api "repos/${{ github.repository }}/git/ref/tags/$c" >/dev/null 2>&1; then
              echo "Tag: $c"
              echo "TAG_NAME=$c" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::error::Tag '$T' v repozitari neexistuje (skusane aj bez/s 'v'). Zadaj tag presne ako v Releases."
          exit 1

      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG_NAME }}

      - name: Verify manifest.json version matches release tag
        run: |
          TAG="${TAG_NAME#v}"
          MANIFEST_VERSION=$(python3 -c "import json; print(json.load(open('custom_components/smart_heating/manifest.json'))['version'])")
          echo "Git tag version: $TAG"
          echo "manifest.json version: $MANIFEST_VERSION"
          if [ "$TAG" != "$MANIFEST_VERSION" ]; then
            echo "::error::Mismatch - git tag is '$TAG' but manifest.json version is '$MANIFEST_VERSION'. Update manifest.json before releasing."
            exit 1
          fi
          echo "OK - tag matches manifest.json"

      - name: Verify package.json version matches release tag (card)
        run: |
          TAG="${TAG_NAME#v}"
          PKG_VERSION=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::warning::package.json version ($PKG_VERSION) does not match release tag ($TAG) - update if the card itself changed in this release."
          else
            echo "OK - package.json matches"
          fi

      - name: Build smart_heating.zip
        run: |
          cd custom_components/smart_heating
          zip -rq ../../smart_heating.zip . -x "*__pycache__*" -x "*.pyc" -x "*.DS_Store"
          cd ../..
          unzip -l smart_heating.zip | grep -q " manifest.json$" || { echo "::error::manifest.json nie je v koreni ZIP-u"; exit 1; }
          unzip -l smart_heating.zip

      - name: Upload ZIP to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG_NAME" smart_heating.zip --clobber
