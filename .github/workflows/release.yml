name: Release consistency check

# HACS pre integracie nepotrebuje build krok - stahuje priamo zipball repozitara
# na danom git tagu. Tento workflow len chyta najcastejsiu chybu: zabudnutu
# aktualizaciu verzie v manifest.json pred vytvorenim GitHub Release.

on:
  release:
    types: [published]

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify manifest.json version matches release tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          TAG="${TAG#v}"
          MANIFEST_VERSION=$(python3 -c "import json; print(json.load(open('custom_components/smart_heating/manifest.json'))['version'])")
          echo "Git tag version: $TAG"
          echo "manifest.json version: $MANIFEST_VERSION"
          if [ "$TAG" != "$MANIFEST_VERSION" ]; then
            echo "::error::Mismatch - git tag is '$TAG' but manifest.json version is '$MANIFEST_VERSION'. Update manifest.json before releasing."
            exit 1
          fi
          echo "OK - tag matches manifest.json"

      - name: Verify package.json version matches release tag (card)
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          TAG="${TAG#v}"
          PKG_VERSION=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::warning::package.json version ($PKG_VERSION) does not match release tag ($TAG) - update if the card itself changed in this release."
          else
            echo "OK - package.json matches"
          fi
